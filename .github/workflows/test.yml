name: EditMode Tests

on:
  workflow_call:
    secrets:
      UNITY_LICENSE:
        required: true
      UNITY_EMAIL:
        required: true
      UNITY_PASSWORD:
        required: true

jobs:
  test:
    name: EditMode Tests
    runs-on: ubuntu-latest

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          dotnet: false

      - uses: actions/checkout@v6
        with:
          lfs: true

      - name: Install SignalR DLLs
        run: make install-signalr

      - name: Cache Unity Library
        uses: actions/cache@v5
        with:
          path: Unity/Library
          key: unity-library-${{ hashFiles('Unity/Assets/**', 'Unity/Packages/**', 'Unity/ProjectSettings/**') }}
          restore-keys: |
            unity-library-

      # Requires UNITY_LICENSE secret to be configured in repository settings.
      # See: https://game.ci/docs/github/activation
      - uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: Unity
          testMode: EditMode
          unityVersion: auto
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-results
          path: artifacts
