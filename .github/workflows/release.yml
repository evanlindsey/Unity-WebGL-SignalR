name: Release

on:
  push:
    branches: [main]
    paths:
      - 'Unity/**'
      - 'Server/**'
      - '.github/workflows/release.yml'

  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0) — overrides auto-detection'
        type: string
        required: false
      dry-run:
        description: 'Run full pipeline without creating a release'
        type: boolean
        default: true

jobs:
  version:
    name: Determine Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      skip: ${{ steps.version.outputs.skip }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get version from PR label or increment patch
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=""

          # Manual override from workflow_dispatch input
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          fi

          # Check for version:X.Y.Z label on merged PR
          if [ -z "$VERSION" ]; then
            PR=$(gh pr list --state merged --base main --json number,labels,mergeCommit \
              --jq ".[] | select(.mergeCommit.oid == \"$GITHUB_SHA\") | {number, labels}")
            if [ -n "$PR" ]; then
              VERSION=$(echo "$PR" | jq -r '.labels[]?.name' | sed -n 's/^version://p')
            fi
          fi

          # No label — auto-increment patch from latest tag
          if [ -z "$VERSION" ]; then
            LATEST=$(git tag -l 'v*' --sort=-v:refname | head -n1)
            if [ -z "$LATEST" ]; then
              VERSION="1.0.0"
              echo "::notice::No existing tags — defaulting to $VERSION"
            else
              LATEST="${LATEST#v}"
              IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST"
              VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
            fi
          fi

          # Check if tag already exists
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Tag v$VERSION already exists — skipping release"
            exit 0
          fi

          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

  build:
    name: WebGL Build
    needs: version
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true

      - uses: ./.github/actions/setup-unity

      - name: Build WebGL
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: Unity
          targetPlatform: WebGL
          unityVersion: auto

      - name: Upload WebGL build
        uses: actions/upload-artifact@v6
        with:
          name: webgl-build
          path: build/WebGL
          if-no-files-found: error

  package:
    name: Export .unitypackage
    needs: version
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true

      - uses: ./.github/actions/setup-unity

      - name: Export .unitypackage
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: Unity
          buildMethod: UnityWebGLSignalR.Editor.ExportPackage.Export
          customParameters: -releaseVersion ${{ needs.version.outputs.version }}
          unityVersion: auto
          allowDirtyBuild: true

      - name: Find .unitypackage
        id: find
        run: |
          PACKAGE=$(find . -maxdepth 2 -name 'unity-webgl-signalr-*.unitypackage' -print -quit)
          if [ -z "$PACKAGE" ]; then
            echo "::error::No .unitypackage found"
            exit 1
          fi
          echo "path=$PACKAGE" >> "$GITHUB_OUTPUT"
          echo "Found package: $PACKAGE"

      - name: Upload .unitypackage
        uses: actions/upload-artifact@v6
        with:
          name: unitypackage
          path: ${{ steps.find.outputs.path }}
          if-no-files-found: error

  release:
    name: Release
    needs: [version, build, package]
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download WebGL build
        uses: actions/download-artifact@v7
        with:
          name: webgl-build
          path: build/WebGL

      - name: Download .unitypackage
        uses: actions/download-artifact@v7
        with:
          name: unitypackage

      - name: Find .unitypackage
        id: package
        run: |
          PACKAGE=$(find . -maxdepth 1 -name 'unity-webgl-signalr-*.unitypackage' -print -quit)
          if [ -z "$PACKAGE" ]; then
            echo "::error::No .unitypackage found"
            exit 1
          fi
          echo "path=$PACKAGE" >> "$GITHUB_OUTPUT"
          echo "Found package: $PACKAGE"

      - name: Update wwwroot
        run: |
          rm -rf Server/wwwroot/Build Server/wwwroot/TemplateData Server/wwwroot/index.html
          cp -r build/WebGL/WebGL/* Server/wwwroot/

      - name: Commit wwwroot updates
        if: inputs.dry-run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Server/wwwroot/
          if git diff --cached --quiet; then
            echo "No wwwroot changes to commit"
          else
            git commit -m "release: v${{ needs.version.outputs.version }} [skip ci]"
            git push
          fi

      - name: Extract changelog
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          BODY=""
          # Try versioned section first
          BODY=$(awk "/^## \[$VERSION\]/{found=1; next} /^## \[/{if(found) exit} found" CHANGELOG.md)
          # Fall back to [Unreleased]
          if [ -z "$BODY" ]; then
            BODY=$(awk '/^## \[Unreleased\]/{found=1; next} /^## \[/{if(found) exit} found' CHANGELOG.md)
          fi
          # Append full changelog comparison link
          LATEST=$(git tag -l 'v*' --sort=-v:refname | head -n1)
          if [ -n "$LATEST" ]; then
            BODY=$(printf '%s\n\n**Full Changelog**: https://github.com/${{ github.repository }}/compare/%s...v%s' "$BODY" "$LATEST" "$VERSION")
          fi
          echo "$BODY" > release-notes.md

      - name: Create tag and GitHub Release
        if: inputs.dry-run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ needs.version.outputs.version }}"
          # Tag the latest commit (includes wwwroot update if one was pushed)
          git pull --ff-only
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" \
            --title "$TAG Unity-WebGL-SignalR" \
            --notes-file release-notes.md \
            "${{ steps.package.outputs.path }}"

      - name: Dry-run summary
        if: inputs.dry-run == 'true'
        run: |
          echo "::notice::Dry run — would release v${{ needs.version.outputs.version }}"
          echo "Package: ${{ steps.package.outputs.path }}"
          echo "Release notes:"
          cat release-notes.md

      - name: Upload artifacts (dry-run)
        if: inputs.dry-run == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: release-dry-run
          path: |
            ${{ steps.package.outputs.path }}
            build/WebGL
